<main class="mx-auto w-full max-w-400 px-9 py-10 max-sm:px-4 max-sm:py-6" x-data="chainTimer" x-cloak>
	<header class="mb-7 flex items-center justify-between gap-5">
		<div><h1 class="m-0 mt-1 mb-2 text-3xl max-sm:text-2xl">Chain Chime</h1></div>
		<time class="shrink-0 whitespace-nowrap font-clock text-2xl font-medium tracking-tighter tabular-nums" :datetime="currentTime" aria-label="Current time" x-text="currentTime"></time>
	</header>
	<section class="rounded-xl border border-solid border-outline bg-white p-6 max-sm:p-4" aria-label="Overall progress">
		<div class="flex items-center justify-between gap-5 max-sm:flex-col max-sm:items-start max-sm:gap-4">
			<div><p class="m-0 mt-1 font-clock text-3xl tabular-nums"><span x-text="formatTime(state.elapsedMs)"></span><span class="text-gray-400"> / </span><span x-text="formatTime(state.totalMs)"></span></p></div>
			<div class="flex flex-wrap gap-2">
				<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover min-w-10 py-2 text-[length:inherit] text-inherit" type="button" @click="actions.adjustElapsed(-1)" aria-label="Align seconds and subtract one minute" title="Align seconds and subtract one minute">−</button>
				<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover min-w-10 py-2 text-[length:inherit] text-inherit" type="button" @click="actions.adjustElapsed(1)" aria-label="Align seconds and add one minute" title="Align seconds and add one minute">+</button>
				<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] disabled:opacity-50 disabled:cursor-not-allowed min-w-24 border-accent bg-accent text-white enabled:[&:hover]:bg-accent-hover px-4 py-2 text-[length:inherit]" type="button" @click="actions.toggle()" :disabled="state.status === 'completed'" x-text="state.status === 'running' ? 'Pause' : 'Start'"></button>
				<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover px-4 py-2 text-[length:inherit] text-inherit" type="button" @click="actions.reset()" :disabled="!state.canEdit">Reset all</button>
			</div>
		</div>
		<div class="mt-5 h-2 overflow-hidden rounded-lg bg-track" role="progressbar" aria-label="Total elapsed time" aria-valuemin="0" :aria-valuemax="state.totalMs" :aria-valuenow="state.elapsedMs" :aria-valuetext="formatTime(state.elapsedMs) + ' / ' + formatTime(state.totalMs)">
			<div class="h-full bg-accent" :style="{ width: (state.elapsedMs / state.totalMs * 100) + '%' }"></div>
		</div>
	</section>
	<section class="mt-7" aria-labelledby="timers-heading">
		<div class="flex items-center justify-between gap-5">
			<h2 class="m-0 text-lg" id="timers-heading">Timers <span class="ml-2 text-sm font-normal text-muted" x-text="state.timers.length + ' / ' + limits.maxCount"></span></h2>
			<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] leading-[inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover px-4 py-2 text-[length:inherit] text-inherit" type="button" @click="actions.add()" :disabled="!state.canAdd">+ Add</button>
		</div>
		<!-- Keep cards in a row. Customize their appearance with the utility classes below. -->
		<div class="timer-list [--timer-scroll-inset:--spacing(1)] flex items-stretch gap-4 overflow-x-auto px-(--timer-scroll-inset) py-4 snap-x snap-proximity" tabindex="0" role="region" aria-label="Timers (scroll horizontally)">
			<template x-for="timer in state.timers" :key="timer.index">
				<article class="timer-card relative grow-0 shrink-0 basis-64 snap-center rounded-xl border border-solid border-outline bg-white p-5 data-[phase=current]:border-timer data-[phase=current]:ring-1 data-[phase=current]:ring-timer data-[phase=finished]:bg-finished" :data-phase="timer.phase" :aria-current="timer.phase === 'current' ? 'step' : null" :aria-labelledby="'timer-title-' + timer.index">
					<div class="flex items-center justify-between gap-2"><h3 class="m-0 text-lg" :id="'timer-title-' + timer.index" x-text="'Timer ' + (timer.index + 1)"></h3></div>
					<!-- Edit this section to change the timer display. -->
					<div class="pt-6 pb-5">
						<p class="m-0 mt-1 mb-4 font-clock text-5xl leading-tight font-medium tracking-tighter tabular-nums" x-text="formatTime(timer.remainingMs, true)"></p>
						<div class="relative h-4 overflow-hidden rounded-sm bg-track" role="progressbar" :aria-label="'Timer ' + (timer.index + 1) + ' progress'" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="Math.round(timer.progress * 100)" :aria-valuetext="'Time left: ' + formatTime(timer.remainingMs, true)">
							<div class="h-full bg-timer" :style="{ width: (timer.progress * 100) + '%' }"></div>
							<template x-for="position in marks(timer.divisions)" :key="position"><span class="absolute inset-y-0 w-1 -translate-x-1/2 bg-white" :style="{ left: position + '%' }" aria-hidden="true"></span></template>
						</div>
						<p class="m-0 mt-2 text-xs text-muted tabular-nums [&_span]:font-clock">Elapsed <span x-text="formatTime(timer.elapsedMs)"></span> / <span x-text="formatTime(timer.minutes * 60_000)"></span></p>
					</div>
					<fieldset class="m-0 flex gap-3 border-0 border-t border-solid border-outline px-0 py-4 disabled:opacity-50" :disabled="!state.canEdit">
						<legend class="sr-only" x-text="'Timer ' + (timer.index + 1) + ' settings'"></legend>
						<label class="min-w-0 flex-1 text-xs text-muted">Minutes<input class="mt-2 w-full rounded-md border border-solid border-outline bg-white px-2 py-2 [font:inherit] text-ink" type="number" required step="1" :min="limits.minMinutes" :max="limits.maxMinutes" :value="timer.minutes" @change="changeValue($event, timer.index, 'minutes')"></label>
						<label class="min-w-0 flex-1 text-xs text-muted">Divisions<input class="mt-2 w-full rounded-md border border-solid border-outline bg-white px-2 py-2 [font:inherit] text-ink" type="number" required step="1" :min="limits.minDivisions" :max="limits.maxDivisions" :value="timer.divisions" @change="changeValue($event, timer.index, 'divisions')"></label>
					</fieldset>
					<div class="flex gap-1">
						<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] leading-[inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover px-2 py-2 text-xs text-inherit" type="button" @click="actions.move(timer.index, -1)" :disabled="!state.canEdit || timer.index === 0" :aria-label="'Move timer ' + (timer.index + 1) + ' left'">←</button>
						<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] leading-[inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover px-2 py-2 text-xs text-inherit" type="button" @click="actions.move(timer.index, 1)" :disabled="!state.canEdit || timer.index === state.timers.length - 1" :aria-label="'Move timer ' + (timer.index + 1) + ' right'">→</button>
						<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] leading-[inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover px-2 py-2 text-xs text-inherit" type="button" @click="actions.resetTimer(timer.index)" :disabled="!state.canEdit">Reset</button>
						<button class="min-h-10 rounded-lg border border-solid cursor-pointer font-[inherit] [font-weight:inherit] leading-[inherit] disabled:opacity-50 disabled:cursor-not-allowed border-outline bg-white enabled:[&:hover]:border-accent enabled:[&:hover]:bg-button-hover px-2 py-2 text-xs ml-auto text-red-800" type="button" @click="actions.remove(timer.index)" :disabled="!state.canRemove">Delete</button>
					</div>
				</article>
			</template>
		</div>
	</section>
	<p class="m-0 mt-5 text-red-800" role="alert" x-show="error" x-text="error"></p>
</main>
